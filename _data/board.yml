  bio: Jason Chance has been active in downtown Griffin for nearly a decade. He currently serves as Chairperson of the Griffin Main Street Board, Vice Chair of the Griffin Downtown Development Authority, and is appointed to the Griffin-Spalding Business Tourism Association. He owns a web development company downtown and has made Griffin and Spalding County home with his son for 17 years.
