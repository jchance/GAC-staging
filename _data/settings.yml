# Newsletter Settings
mailchimp__settings:
  mailchimp__title: Stay <span class="text-span">Connected</span>
  mailchimp__text: "Get updates on upcoming events, artist opportunities, and community stories."
  mailchimp__identifier:
  mailchimp__button__text: Subscribe


