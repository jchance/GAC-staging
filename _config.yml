#-------------------------------
# General Site Settings
baseurl: "/GAC-staging" # the subpath of your site, e.g. /blog
url: "https://jchance.github.io" # the base hostname & protocol for your site, e.g. http://example.com


#-------------------------------
# Build Settings
markdown: kramdown
future: true
permalink: /:title
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from
  - jekyll-archives
  - jekyll-include-cache
  - jekyll_picture_tag
  - jekyll-llms-generator
  - jekyll-social-share

jekyll-archives:
  enabled: []
  layout: archive
  permalinks:
    year: '/:year/'
    month: '/:year/:month/'
    day: '/:year/:month/:day/'
    tag: '/tag/:name/'
    category: '/category/:name/'

paginate: 6
paginate_path: "/blog/page/:num"


# Collections
collections:
  pages:
    output: true
    permalink: /:name
  posts:
    output: true
    permalink: /blog/:slug
  events:
    output: true
    permalink: /events/:slug

# Pages Path
defaults:
  - scope:
      path: ""
    values:
      layout: "default"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"


# Tags
tag_page_dir:         tag
tag_page_layout:      tag_page
tag_permalink_style:  /:title

sass:
  sass_dir: _sass
  style: compressed

exclude:
  - private-assets

llms_txt:
  title: "Griffin Arts Council"
  tagline: "Igniting creativity. Championing emerging artists."
  intro: |
    Griffin Arts Council empowers creatives through transformative arts education,
    modern programming, and an inclusive arts community in Griffin, Georgia.
  link_tag: false
  full: true
  sections:
    - title: "News"
      collection: posts
    - title: "Events"
      collection: events
social_share:
  services:
    - facebook
    - linkedin
    - threads
    - bluesky
    - pinterest
    - whatsapp
    - email
    - copy
    - print
  label: "Share this story"
  icon_only: true