<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <script>
    (function () {
      var theme;
      try {
        theme = localStorage.getItem("gac-theme");
      } catch (error) {}
      if (theme === "light" || theme === "dark") {
        document.documentElement.dataset.theme = theme;
      }
      var dark = theme === "dark" || (!theme && window.matchMedia("(prefers-color-scheme: dark)").matches);
      document.querySelector('meta[name="theme-color"]').content = dark ? "#091923" : "#ffffff";
    }());
  </script>

  <title>{% if page.title %}{{ page.title }}{% else %}{{ site.data.settings.title }}{% endif %}</title>
  <meta name='description' content='{% if page.description %}{{ page.description | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.data.settings.description }}{% endif %}'>

  <link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">
  <link rel="ai" href="{{ '/llms.txt' | absolute_url }}">

  <!-- Favicon -->
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{% if page.url == "/" %}{{ site.data.settings.title }}{% else %}{{ page.title }} – {{ site.data.settings.title }}{% endif %}">
  <meta name="twitter:description" content="{% if page.url == "/" %}{{ site.data.settings.description | strip_html | xml_escape }}{% elsif page.description %}{{ page.description | strip_html | xml_escape }}{% else %}{{ page.excerpt | strip_html | xml_escape }}{% endif %}">
  <meta name="twitter:image:src" content="{% if page.url == "/" %}{{ site.data.settings.hero.image | absolute_url }}{% else %}{{ page.image | default: site.data.settings.logo_footer | absolute_url }}{% endif %}">

  <!-- Facebook OpenGraph -->
  <meta property="og:type" content="{% if page.url == "/" %}website{% else %}article{% endif %}">
  <meta property="og:url" content="{{ page.url | replace:'index.html','' | absolute_url }}">
  <meta property="og:site_name" content="{{ site.data.settings.title }}">
  <meta property="og:title" content="{% if page.url == "/" %}{{ site.data.settings.title }}{% else %}{{ page.title }} – {{ site.data.settings.title }}{% endif %}">
  <meta property="og:description" content="{% if page.url == "/" %}{{ site.data.settings.description | strip_html | xml_escape }}{% elsif page.description %}{{ page.description | strip_html | xml_escape }}{% else %}{{ page.excerpt | strip_html | xml_escape }}{% endif %}">
  <meta property="og:image" content="{% if page.url == "/" %}{{ site.data.settings.hero.image | absolute_url }}{% else %}{{ page.image | default: site.data.settings.logo_footer | absolute_url }}{% endif %}">

  <!-- Structured data (Organization) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "NGO",
    "name": {{ site.data.settings.title | jsonify }},
    "url": {{ site.url | jsonify }},
    "logo": {{ site.data.settings.logo | absolute_url | jsonify }},
    "description": {{ site.data.settings.description | strip_html | jsonify }}{% if site.data.settings.social %},
    "sameAs": [
      {% for item in site.data.settings.social %}{{ item.link | jsonify }}{% unless forloop.last %},{% endunless %}
      {% endfor %}
    ]{% endif %}
  }
  </script>

  <!-- Resource hints -->
  <link rel="preconnect" href="https://use.typekit.net" crossorigin>
  <link rel="preconnect" href="https://kit.fontawesome.com">
  <link rel="preconnect" href="https://ka-f.fontawesome.com" crossorigin>
  <link rel="preconnect" href="https://www.googletagmanager.com">

  <!-- Fonts -->
  <link rel="stylesheet" href="https://use.typekit.net/tlc7ffz.css">

  <!-- Font Awesome -->
  <script src="https://kit.fontawesome.com/816011ad65.js" crossorigin="anonymous"></script>

  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
